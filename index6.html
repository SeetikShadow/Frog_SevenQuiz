<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = parseInt(prompt("Enter a five-digit number:"));
        let lastDigit = num % 10;
        let remainingDigits = Math.floor(num / 10);
        let result = lastDigit * 10000 + remainingDigits;
        alert("Result: " + result);
    </script>
</body>
</html>
