<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let sales = parseFloat(prompt("Enter the total sales amount for the month ($):"));
        let salary = 250 + (sales * 0.10);
        alert("Employee's salary: $" + salary.toFixed(2));
    </script>
</body>
</html>
