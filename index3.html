<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let distance = parseFloat(prompt("Enter here distance in km:"));
        let time = parseFloat(prompt("How time do u need?"));
        let speed = distance / time;
        alert("Needed speed: " + speed.toFixed(2) + " km/h.");
    </script>
</body>
</html>
