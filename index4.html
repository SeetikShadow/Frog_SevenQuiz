<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const USD_TO_EUR = 0.92;
        let dollars = parseFloat(prompt("Enter amount in USD ($):"));
        let euros = dollars * USD_TO_EUR;
        alert("sum in EUR: " + euros.toFixed(2) + " €");
    </script>
</body>
</html>
